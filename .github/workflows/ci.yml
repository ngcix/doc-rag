name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests services tools
      - run: ruff format --check src tests services tools scripts
      - run: pyright src
      - run: python tools/check_file_lengths.py
      - run: pytest -q
      - run: python -m build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -f services/rag/Dockerfile .
      - run: docker build -f services/embedding/Dockerfile .
