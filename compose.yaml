# Portainer-ready stack. Images are prebuilt (no build: section). The mounted
# folder (./data in this repo, a host path on the node) holds everything that is
# not code:
#
#   data/
#     config/setting.json            runtime settings
#     models/embedding/              exported TEI model files (+ rag.env)
#     documents/, vectordb/,         written by rag
#     faiss_index/, extracted_images/
#     process/                       sequence-chart and image outputs
#
# Each service mounts that folder at /specrag. Change the host path in the
# volumes entries if it lives elsewhere.

services:
  embedding:
    image: specrag-embedding:0.4.0
    command:
      - --model-id
      - /specrag/models/embedding
      - --pooling
      - cls
      - --max-client-batch-size
      - "32"
      - --auto-truncate
      - --port
      - "80"
    volumes:
      - ./data:/specrag:ro
    ports:
      - "13333:80"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:80/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    cpus: 4
    mem_limit: 4g
    restart: unless-stopped

  rag:
    image: specrag-rag:0.4.0
    user: "1000:1000"
    environment:
      SPECRAG_BASE_DIR: /specrag
      EMBEDDING_URL: http://embedding:80
      EMBEDDING_SERVED_MODEL: /specrag/models/embedding
      EMBEDDING_MODEL_VARIANT: onnx-o3-fp32
    volumes:
      - ./data:/specrag
    ports:
      - "9999:8080"
    depends_on:
      embedding:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/ready')"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    cpus: 2
    # Embeddings, chunk text, and the FAISS index are held in memory.
    mem_limit: 10g
    restart: unless-stopped
