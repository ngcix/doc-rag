<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The page is served from <prefix>/ui/; relative API paths resolve from <prefix>/ so the UI works behind a path-prefix proxy. -->
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpecRAG</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7280; --border: #e2e5ea;
    --accent: #2563eb; --ok: #15803d; --warn: #b45309; --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161b; --panel: #1c1f26; --text: #e6e8ec; --muted: #9aa1ad; --border: #2c3038;
            --accent: #60a5fa; --ok: #4ade80; --warn: #fbbf24; --err: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 24px; padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 18px; }
  nav button { background: none; border: none; padding: 6px 12px; color: var(--muted); font: inherit; cursor: pointer; border-radius: 6px; }
  nav button.active { color: var(--text); background: var(--bg); font-weight: 600; }
  main { max-width: 1000px; margin: 24px auto; padding: 0 24px; }
  section { display: none; } section.active { display: block; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { margin: 0 0 12px; font-size: 15px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input, select, button.btn { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
  input[type=search] { flex: 1; min-width: 240px; }
  input[type=number] { width: 72px; }
  button.btn { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--err); }
  button:disabled { opacity: .5; cursor: default; }
  .muted { color: var(--muted); }
  .result { border-top: 1px solid var(--border); padding: 12px 0; }
  .result:first-child { border-top: none; padding-top: 0; }
  .result .meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .result .source { font-weight: 600; color: var(--text); }
  .result .content { white-space: pre-wrap; word-break: break-word; max-height: 7.5em; overflow: hidden; }
  .result.expanded .content { max-height: none; }
  .link { background: none; border: none; padding: 0; color: var(--accent); cursor: pointer; font: inherit; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-top: 1px solid var(--border); vertical-align: top; }
  th { border-top: none; font-size: 12px; color: var(--muted); font-weight: 500; }
  td.num, th.num { text-align: right; }
  .drop { display: block; cursor: pointer; border: 2px dashed var(--border); border-radius: 8px; padding: 20px; text-align: center; color: var(--muted); }
  .drop.over { border-color: var(--accent); color: var(--text); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; border: 1px solid currentColor; }
  .s-queued, .s-running { color: var(--warn); } .s-succeeded { color: var(--ok); } .s-failed { color: var(--err); }
  .error { color: var(--err); }
</style>
</head>
<body>
<header>
  <h1>SpecRAG</h1>
  <nav>
    <button data-tab="search" class="active">Search</button>
    <button data-tab="documents">Documents</button>
  </nav>
</header>
<main>
  <section id="search" class="active">
    <div class="panel">
      <form id="search-form" class="row">
        <input type="search" id="query" placeholder="Search specifications…" required autofocus>
        <select id="mode" title="Search mode">
          <option value="semantic">Semantic</option>
          <option value="hybrid">Hybrid (BM25 + vector)</option>
        </select>
        <label class="muted">Top <input type="number" id="top-k" value="5" min="1" max="100"></label>
        <button class="btn primary">Search</button>
      </form>
    </div>
    <div class="panel" id="results-panel" hidden>
      <div class="muted" id="results-summary"></div>
      <div id="results"></div>
    </div>
  </section>

  <section id="documents">
    <div class="panel">
      <h2>Upload</h2>
      <label class="drop" id="drop">
        Drop files here or click to choose
        <div class="muted" id="allowed"></div>
        <input type="file" id="file" multiple hidden>
      </label>
    </div>
    <div class="panel" id="jobs-panel" hidden>
      <h2>Jobs</h2>
      <table>
        <thead><tr><th>Job</th><th>Document</th><th>Status</th><th>Details</th></tr></thead>
        <tbody id="jobs"></tbody>
      </table>
    </div>
    <div class="panel">
      <h2>Indexed documents <span class="muted" id="doc-count"></span></h2>
      <table>
        <thead><tr><th>Document</th><th class="num">Chunks</th><th></th></tr></thead>
        <tbody id="docs"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
const ALLOWED = [".txt", ".md", ".markdown", ".pdf", ".docx", ".xlsx", ".xls", ".pptx"];
const $ = (id) => document.getElementById(id);
const basename = (path) => path.split(/[\\/]/).pop();

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children.filter((c) => c !== null && c !== undefined));
  return node;
}

async function api(path, options = {}) {
  const response = await fetch(path, options);
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.detail ? JSON.stringify(body.detail).replace(/^"|"$/g, "") : `HTTP ${response.status}`);
  return body;
}

// Tabs
document.querySelectorAll("nav button").forEach((button) => {
  button.onclick = () => {
    document.querySelectorAll("nav button, section").forEach((n) => n.classList.remove("active"));
    button.classList.add("active");
    $(button.dataset.tab).classList.add("active");
    if (button.dataset.tab === "documents") loadDocuments();
  };
});

// Search
$("search-form").onsubmit = async (event) => {
  event.preventDefault();
  const results = $("results");
  $("results-panel").hidden = false;
  $("results-summary").textContent = "Searching…";
  results.replaceChildren();
  try {
    const data = await api("api/v1/search", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ query: $("query").value, mode: $("mode").value, top_k: Number($("top-k").value) }),
    });
    $("results-summary").textContent = `${data.results.length} results in ${Math.round(data.latency_ms)} ms`;
    results.append(...data.results.map(renderResult));
  } catch (error) {
    $("results-summary").replaceChildren(el("span", { className: "error", textContent: error.message }));
  }
};

function renderResult(r) {
  const m = r.metadata || {};
  const where = [m.content_type, m.page_number && `page ${m.page_number}`, m.total_chunks && `chunk ${Number(m.chunk_index) + 1}/${m.total_chunks}`].filter(Boolean).join(" · ");
  const card = el("div", { className: "result" },
    el("div", { className: "meta" },
      el("span", { textContent: `#${r.rank}` }),
      el("span", { className: "source", textContent: basename(m.source_file || r.chunk_id) }),
      where ? el("span", { textContent: where }) : null,
      el("span", { textContent: `score ${r.similarity.toFixed(3)}` }),
    ),
    el("div", { className: "content", textContent: r.document }),
  );
  if (r.document.split("\n").length > 5 || r.document.length > 400) {
    const toggle = el("button", { className: "link", textContent: "Show more" });
    toggle.onclick = () => { toggle.textContent = card.classList.toggle("expanded") ? "Show less" : "Show more"; };
    card.append(toggle);
  }
  return card;
}

// Documents
async function loadDocuments() {
  const tbody = $("docs");
  try {
    const data = await api("api/v1/documents");
    $("doc-count").textContent = `(${data.total})`;
    tbody.replaceChildren(...data.documents.map((doc) => {
      const del = el("button", { className: "btn danger", textContent: "Delete" });
      del.onclick = () => deleteDocument(doc.source, del);
      return el("tr", {},
        el("td", { textContent: basename(doc.source), title: doc.source }),
        el("td", { className: "num", textContent: doc.chunk_count }),
        el("td", { className: "num" }, del),
      );
    }));
    if (!data.total) tbody.replaceChildren(el("tr", {}, el("td", { colSpan: 3, className: "muted", textContent: "No documents indexed yet." })));
  } catch (error) {
    tbody.replaceChildren(el("tr", {}, el("td", { colSpan: 3, className: "error", textContent: error.message })));
  }
}

async function deleteDocument(source, button) {
  if (!confirm(`Delete ${basename(source)} and remove it from the index?`)) return;
  button.disabled = true;
  try {
    await api(`api/v1/documents?source=${encodeURIComponent(source)}`, { method: "DELETE" });
    pollJobs();
  } catch (error) {
    alert(error.message);
    button.disabled = false;
  }
}

// Upload
$("allowed").textContent = `Supported: ${ALLOWED.join(" ")}`;
$("file").accept = ALLOWED.join(",");
$("file").onchange = (event) => { uploadFiles(event.target.files); event.target.value = ""; };
const drop = $("drop");
drop.ondragover = (event) => { event.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (event) => { event.preventDefault(); drop.classList.remove("over"); uploadFiles(event.dataTransfer.files); };

async function uploadFiles(files) {
  for (const file of files) {
    const form = new FormData();
    form.append("file", file);
    try {
      await api("api/v1/documents/upload", { method: "POST", body: form });
    } catch (error) {
      alert(`${file.name}: ${error.message}`);
    }
  }
  pollJobs();
}

// Jobs
let pollTimer = null;
const seenFinished = new Set();

async function pollJobs() {
  clearTimeout(pollTimer);
  let jobs = [];
  try {
    jobs = (await api("api/v1/jobs")).jobs;
  } catch {
    pollTimer = setTimeout(pollJobs, 3000);
    return;
  }
  $("jobs-panel").hidden = jobs.length === 0;
  $("jobs").replaceChildren(...jobs.slice(0, 20).map(renderJob));
  const newlyFinished = jobs.filter((job) => job.finished_at && !seenFinished.has(job.id));
  newlyFinished.forEach((job) => seenFinished.add(job.id));
  if (newlyFinished.length) loadDocuments();
  if (jobs.some((job) => !job.finished_at)) pollTimer = setTimeout(pollJobs, 1500);
}

function renderJob(job) {
  const r = job.result || {};
  const elapsed = job.finished_at && job.started_at ? `${(job.finished_at - job.started_at).toFixed(1)} s` : "";
  const details = job.error
    ? el("span", { className: "error", textContent: job.error })
    : job.kind === "ingest" && job.status === "succeeded"
      ? `${r.indexed_items} items indexed, ${elapsed}`
      : job.kind === "delete" && job.status === "succeeded"
        ? `${r.deleted_chunks} chunks removed`
        : elapsed;
  return el("tr", {},
    el("td", { textContent: job.kind }),
    el("td", { textContent: basename(job.target), title: job.target }),
    el("td", {}, el("span", { className: `badge s-${job.status}`, textContent: job.status })),
    el("td", {}, details),
  );
}

pollJobs();
</script>
</body>
</html>
