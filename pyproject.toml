# Please don't delete this file, we're still using for linting and formatting rules
[project]
name = "specrag"
version = "0.3.2"
description = "A simple RAG system with chunking, vectorization, and semantic search"
authors = [
    { name = "Phùng Đức Vũ", email = "vu.pd@samsung.com" },
    { name = "Ngô Văn Cảnh", email = "nv.canh@samsung.com" },
    { name = "Nguyễn Hà Phong", email = "haphong.ng@samsung.com" },
    { name = "Nguyễn Quang Đoàn", email = "doan.ng@samsung.com" },
    { name = "Nguyễn Thanh Cương", email = "cuong.nguyen@samsung.com" },
    { name = "Nguyễn Mạnh Dũng", email = "manhdung.ng@samsung.com" },
]
readme = "README.md"
requires-python = ">=3.10"

# Should match with requirements.txt
dependencies = [
    "transformers>=4.35.0,<5.0.0",
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",
    "faiss-cpu>=1.7.4",
    "langchain>=0.1.0",
    "langchain-text-splitters>=0.0.1",
    "python-docx>=0.8.11",
    "PyMuPDF>=1.23.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "tqdm>=4.66.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pyinstaller",
    "Cython",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
specrag = "src.main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
line-length = 180 # I don't want to hard wrap long-line

[tool.ruff.format]
quote-style = "double" # Use double quotes for strings.
indent-style = "space" # Indent with spaces, rather than tabs.

[tool.ruff.lint]
ignore = [
    "F401",
    "F403",
    "F405",
    "E402",
] # Ignore import warning


#https://microsoft.github.io/pyright/#/configuration?id=sample-pyprojecttoml-file
[tool.pyright]
exclude = ["**/__pycache__"]
extraPaths = []
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportOptionalMemberAccess = false
reportFunctionMemberAccess = false
reportAttributeAccessIssue = false
reportGeneralTypeIssues = false
